# benchmarl/conf/task/vmas/target_defense_smart_w_multi_obs.yaml
# Normalized to the same 1x1 arena and spatial scale as the rest of the
# curriculum (basic / smart / w_obs / multi_obs_hetero), so the five stages
# form a real progression rather than differently-scaled tasks. This env was
# previously scaled for a 2x arena (semidim 1.0, every absolute distance
# doubled); arena_semidim is now 0.5 and all those values are back to the
# shared baseline. obstacle_radius matches target_defense_smart_w_obs.py.
max_steps: 1000
num_defenders: 2
num_attackers: 1
sensing_radius: 0.3
attacker_sensing_radius: 0.3
speed_ratio: 0.3
target_distance: 0.05
randomize_attacker_x: true
num_spawn_positions: 0
spawn_area_mode: true
spawn_area_width: 0.1
enable_wall_constraints: false
wall_epsilon: 0.03
fixed_attacker_policy: false
use_apollonius: true
obstacle_radius: 0.03
num_obstacles: 3
capture_distance: 0.07
defender_clustering_penalty: 0.002
